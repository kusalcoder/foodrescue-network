services:
  - type: web
    name: foodrescue-network
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/ensure_db.py && gunicorn --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: foodrescue-network-db
          property: connectionString
      - key: UPLOAD_FOLDER
        value: uploads
      - key: MAX_FILE_SIZE
        value: "5242880"

databases:
  - name: foodrescue-network-db
    plan: free
    databaseName: foodrescue
    user: foodrescue
