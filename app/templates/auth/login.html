{% extends "base.html" %}

{% block title %}Log In — Help With Food{% endblock %}

{% block content %}
<section class="auth-page">
  <h1>Log in</h1>

  <div id="form-alert"></div>

  <form id="login-form" novalidate>
    <div class="form-field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email">
      <div class="field-error" data-error-for="email"></div>
    </div>

    <div class="form-field">
      <label for="password">Password</label>
      <div class="password-input-wrap">
        <input type="password" id="password" name="password" required autocomplete="current-password">
        <button type="button" class="password-toggle-btn" data-toggle-target="password" aria-label="Show password" title="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
      <div class="field-error" data-error-for="password"></div>
    </div>

    <button type="submit" class="btn btn--primary" id="submit-btn">Log In</button>
  </form>

  <p class="text-muted" style="margin-top: var(--space-4);">
    Don't have an account yet? <a href="{{ url_for('frontend.register_page') }}">Register</a>
  </p>
</section>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/auth-forms.js') }}"></script>
{% endblock %}
