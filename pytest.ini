[pytest]
; Phase 12 — pytest configuration.
;
; Tests need FLASK_ENV=testing so app/config.py's get_config() picks
; TestingConfig (which reads TEST_DATABASE_URL instead of
; DATABASE_URL). tests/conftest.py sets this in os.environ before the
; app is imported, so no pytest-env plugin is required — this also
; guarantees `python run.py` and `pytest` can never accidentally point
; at the same database.

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; Custom markers used to select subsets of the suite, e.g.:
;     pytest -m "not slow"
;     pytest -m concurrency
markers =
    slow: marks tests that are slower than the rest of the suite (rate limiting, concurrency)
    concurrency: marks tests that exercise multi-threaded / row-locking behavior
